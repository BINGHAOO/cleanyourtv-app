# The build box (forge, 3 GB container) and CI runners are small: one Gradle JVM, Kotlin in process.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# Test build 0.3.5-test1 only (branch test-lists): bundle the candidate lists in core/spec/candidates.
# scripts/release-on-forge.sh takes no Gradle property, so the flag is on here; -Pcyt.candidates=false
# builds without them.
cyt.candidates=true
